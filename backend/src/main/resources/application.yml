spring:
  application:
    name: task-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dbtask}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true

app:
  security:
    google-client-id: ${GOOGLE_CLIENT_ID:xxxx.apps.googleusercontent.com}